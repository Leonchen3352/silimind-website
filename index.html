<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SiliMind · 维护中</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="SiliMind 官网正在维护升级，预计很快恢复访问。" />
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --text-primary: #f0f0f5;
    --text-secondary: rgba(240, 240, 245, 0.6);
    --border: rgba(99, 102, 241, 0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12), transparent 60%), var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.4px;
  }
  .logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    color: var(--accent-light);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }
  h1 {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 14px;
    line-height: 1.4;
  }
  p {
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .pulse {
    margin-top: 28px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-light);
    box-shadow: 0 0 0 0 rgba(129, 140, 248, 0.7);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0   rgba(129, 140, 248, 0.6); }
    70%  { box-shadow: 0 0 0 12px rgba(129, 140, 248, 0);   }
    100% { box-shadow: 0 0 0 0   rgba(129, 140, 248, 0);   }
  }
  .contact {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-secondary);
  }
  .contact a {
    color: var(--accent-light);
    text-decoration: none;
    border-bottom: 1px dashed rgba(129, 140, 248, 0.4);
  }
  footer {
    margin-top: 18px;
    font-size: 12px;
    color: rgba(240, 240, 245, 0.35);
  }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo">
      <span class="logo-mark">S</span>
      <span>SiliMind</span>
    </div>
    <span class="badge">MAINTENANCE</span>
    <h1>网站正在维护升级</h1>
    <p>我们正在做一些必要的升级工作，很快就会恢复访问。</p>
    <p>感谢你的耐心等候。</p>

    <div class="pulse">
      <span class="pulse-dot"></span>
      <span>预计短期内恢复</span>
    </div>

    <div class="contact">
      商务合作 / 紧急联系：<a href="mailto:contact@silimind.net">contact@silimind.net</a>
    </div>

    <footer>© SiliMind · 思理智能</footer>
  </main>
</body>
</html>
