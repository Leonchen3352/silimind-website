<head>
  <meta charset="UTF-8" />

  <link rel="canonical" href="https://www.silimind.net/blog/" />
  <meta property="og:title" content="Blog - SiliMind" />
  <meta property="og:description" content="SiliMind 博客 — 探索 AI Agent 最新趋势、企业智能化实践与技术洞察。" />
  <meta property="og:url" content="https://www.silimind.net/blog/" />

  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #16161f;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --text-primary: #f0f0f5;
      --text-secondary: rgba(240,240,245,0.6);
      --border: rgba(99,102,241,0.08);
      --border-hover: rgba(99,102,241,0.25);
      --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Noto Sans SC', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
    }

    /* Nav */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      height: 64px;
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 32px;
      height: 100%; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-size: 20px; font-weight: 700; color: var(--accent-light);
      text-decoration: none; letter-spacing: 1px;
    }
    .nav-links { list-style: none; display: flex; gap: 32px; }
    .nav-links a {
      color: var(--text-secondary); text-decoration: none; font-size: 14px;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text-primary); }

    /* Page header */
    .page-header {
      padding: 120px 32px 60px;
      text-align: center;
    }
    .page-header h1 {
      font-size: 36px; font-weight: 700; margin-bottom: 12px;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-header p {
      color: var(--text-secondary); font-size: 16px; max-width: 560px; margin: 0 auto;
    }

    /* Blog grid */
    .blog-grid {
      max-width: 900px; margin: 0 auto; padding: 0 32px 80px;
      display: grid; grid-template-columns: 1fr; gap: 24px;
    }
    .blog-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 32px;
      transition: border-color 0.2s, transform 0.2s;
      text-decoration: none;
      display: block;
    }
    .blog-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }
    .blog-card h2 {
      font-size: 20px; font-weight: 600; margin-bottom: 8px;
      color: var(--text-primary);
    }
    .blog-card .date {
      font-size: 13px; color: var(--text-secondary); margin-bottom: 10px;
    }
    .blog-card .excerpt {
      font-size: 14px; color: var(--text-secondary); line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 60px 32px;
      color: var(--text-secondary);
    }
    .empty-state p { font-size: 15px; }

    /* Footer */
    footer {
      text-align: center; padding: 40px 32px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary); font-size: 13px;
    }

    @media (max-width: 768px) {
      .page-header h1 { font-size: 28px; }
      .blog-grid { padding: 0 16px 60px; }
      .blog-card { padding: 20px 24px; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">SiliMind</a>
      <ul class="nav-links">
        <li><a href="/blog/" class="active">Blog</a></li>
        <li><a href="/#features">核心能力</a></li>
        <li><a href="#">解决方案</a></li>
        <li><a href="#">关于我们</a></li>
      </ul>
    </div>
  </nav>

  <section class="page-header">
    <h1>Blog</h1>
    <p>探索 AI Agent 最新趋势、企业智能化实践与技术洞察</p>
  </section>

  <section class="blog-grid">
    <!-- 示例文章卡片 — 后续每篇新文章发布时在此列表最前面添加 -->
    <a href="/blog/example-post" class="blog-card">
      <h2>示例文章标题</h2>
      <div class="date">2026-07-29</div>
      <p class="excerpt">这是一篇示例文章，用于验证博客文章详情页模板是否正常工作。正式文章发布后，此卡片将被替换。</p>
    </a>
  </section>

  <footer>
    <p>© 2026 SiliMind. All rights reserved.</p>
  </footer>
</body>
</html>
