  <script>
    (function(){
      var nav=document.querySelector('.sm-nav');var t=document.querySelector('.sm-toggle');
      if(!nav||!t)return;
      t.addEventListener('click',function(e){e.stopPropagation();var o=nav.classList.toggle('sm-open');t.setAttribute('aria-expanded',o?'true':'false');});
      document.addEventListener('click',function(e){if(nav.classList.contains('sm-open')&&!nav.contains(e.target)){nav.classList.remove('sm-open');t.setAttribute('aria-expanded','false');}});
      var m=nav.querySelector('.sm-menu');
      if(m){m.addEventListener('click',function(e){if(e.target.closest('a')){nav.classList.remove('sm-open');t.setAttribute('aria-expanded','false');}});}
    })();
  </script>
